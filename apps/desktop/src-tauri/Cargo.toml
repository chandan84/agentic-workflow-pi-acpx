[package]
name = "awpa-desktop"
version = "0.1.0"
description = "Agentic Workflow Platform desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "awpa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
