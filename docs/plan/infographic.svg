<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="1640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="64" y="74" fill="#f8fafc" font-size="40" font-weight="700">Agentic Workflow Platform</text>
  <text x="64" y="108" fill="#94a3b8" font-size="20">pi agents · acpx flows · ACP · Temporal durability · Tauri + React desktop · Rust backend</text>
  <rect x="64" y="124" width="320" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Section A: layered stack -->
  <text x="64" y="180" fill="#e2e8f0" font-size="24" font-weight="600">The layered stack</text>

  <g filter="url(#shadow)">
    <rect x="64" y="200" width="540" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="227" fill="#f8fafc" font-size="18" font-weight="600">React UI  (card-based)</text>
    <text x="84" y="248" fill="#94a3b8" font-size="14">React Flow canvas + ELK layout · Zustand · live path highlight</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="268" width="540" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="295" fill="#f8fafc" font-size="18" font-weight="600">Temporal  —  durable run wrapper</text>
    <text x="84" y="316" fill="#94a3b8" font-size="14">CLI dev server + SQLite · signals · timers · retries · replay</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="336" width="540" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="363" fill="#f8fafc" font-size="18" font-weight="600">acpx  —  workflow engine + ACP client</text>
    <text x="84" y="384" fill="#94a3b8" font-size="14">.flow.ts · step routing · outputs · checkpoints · trace bundles</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="404" width="540" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="431" fill="#f8fafc" font-size="18" font-weight="600">ACP  —  JSON-RPC 2.0 over stdio</text>
    <text x="84" y="452" fill="#94a3b8" font-size="14">session/new · session/prompt - session/update · permissions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="472" width="540" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="84" y="499" fill="#f8fafc" font-size="18" font-weight="600">pi  —  isolated agent runtime</text>
    <text x="84" y="520" fill="#94a3b8" font-size="14">one .pi workspace per agent · extensions / skills / prompts</text>
  </g>

  <line x1="334" y1="258" x2="334" y2="268" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="334" y1="326" x2="334" y2="336" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="334" y1="394" x2="334" y2="404" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="334" y1="462" x2="334" y2="472" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Section: backend box -->
  <text x="660" y="180" fill="#e2e8f0" font-size="24" font-weight="600">Rust backend (the core)</text>
  <g filter="url(#shadow)">
    <rect x="660" y="200" width="556" height="330" rx="14" fill="#0b1220" stroke="#334155"/>
    <rect x="684" y="228" width="508" height="56" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="252" fill="#f8fafc" font-size="16" font-weight="600">gRPC gateway (tonic)</text>
    <text x="704" y="272" fill="#94a3b8" font-size="13">AgentGroup · Workflow · Execution · Observability</text>

    <rect x="684" y="296" width="246" height="80" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="320" fill="#f8fafc" font-size="16" font-weight="600">Domain + sqlx</text>
    <text x="704" y="341" fill="#94a3b8" font-size="13">groups · agents · flows</text>
    <text x="704" y="360" fill="#94a3b8" font-size="13">runs · work-items · audit</text>

    <rect x="946" y="296" width="246" height="80" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="966" y="320" fill="#f8fafc" font-size="16" font-weight="600">Temporal client</text>
    <text x="966" y="341" fill="#94a3b8" font-size="13">start · signal · query</text>
    <text x="966" y="360" fill="#94a3b8" font-size="13">workflow == flow run</text>

    <rect x="684" y="388" width="508" height="80" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="412" fill="#f8fafc" font-size="16" font-weight="600">Temporal worker (Rust preview SDK)</text>
    <text x="704" y="433" fill="#94a3b8" font-size="13">activities shell out to acpx / pi · checkpoint-segmented</text>
    <text x="704" y="452" fill="#fbbf24" font-size="13">pin versions — SDK is pre-GA</text>

    <rect x="684" y="480" width="508" height="34" rx="9" fill="#0f172a" stroke="#3b4d6b"/>
    <text x="704" y="502" fill="#94a3b8" font-size="13">Postgres = app data · SQLite = Temporal state · Disk = trace bundles + blobs</text>
  </g>

  <!-- Section B: pipeline -->
  <text x="64" y="600" fill="#e2e8f0" font-size="24" font-weight="600">From prompt to durable, replayable run</text>

  <g font-size="14">
    <g filter="url(#shadow)">
      <rect x="64" y="624" width="172" height="78" rx="10" fill="#312e81" stroke="#6366f1"/>
      <text x="80" y="652" fill="#e0e7ff" font-size="15" font-weight="600">1 · Prompt</text>
      <text x="80" y="674" fill="#c7d2fe">User describes</text>
      <text x="80" y="692" fill="#c7d2fe">the workflow</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="268" y="624" width="172" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="284" y="652" fill="#f8fafc" font-size="15" font-weight="600">2 · Author</text>
      <text x="284" y="674" fill="#94a3b8">common pi agent</text>
      <text x="284" y="692" fill="#94a3b8">- Flow IR (JSON)</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="472" y="624" width="172" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="488" y="652" fill="#f8fafc" font-size="15" font-weight="600">3 · Edit</text>
      <text x="488" y="674" fill="#94a3b8">canvas (WYSIWYG)</text>
      <text x="488" y="692" fill="#94a3b8">validate + verify</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="676" y="624" width="172" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="692" y="652" fill="#f8fafc" font-size="15" font-weight="600">4 · Run</text>
      <text x="692" y="674" fill="#94a3b8">Temporal wraps</text>
      <text x="692" y="692" fill="#94a3b8">acpx - pi (ACP)</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="880" y="624" width="172" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="896" y="652" fill="#f8fafc" font-size="15" font-weight="600">5 · Approve</text>
      <text x="896" y="674" fill="#94a3b8">checkpoint gate</text>
      <text x="896" y="692" fill="#94a3b8">signal + timer</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1084" y="624" width="132" height="78" rx="10" fill="#064e3b" stroke="#10b981"/>
      <text x="1100" y="652" fill="#d1fae5" font-size="15" font-weight="600">6 · Replay</text>
      <text x="1100" y="674" fill="#a7f3d0">path highlight</text>
      <text x="1100" y="692" fill="#a7f3d0">+ audit</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="236" y1="663" x2="266" y2="663"/>
    <line x1="440" y1="663" x2="470" y2="663"/>
    <line x1="644" y1="663" x2="674" y2="663"/>
    <line x1="848" y1="663" x2="878" y2="663"/>
    <line x1="1052" y1="663" x2="1082" y2="663"/>
  </g>

  <!-- Section C: groups & agents -->
  <text x="64" y="760" fill="#e2e8f0" font-size="24" font-weight="600">Agents group &amp; isolation</text>
  <g filter="url(#shadow)">
    <rect x="64" y="784" width="556" height="240" rx="14" fill="#0b1220" stroke="#334155"/>
    <rect x="88" y="812" width="508" height="44" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="108" y="840" fill="#f8fafc" font-size="16" font-weight="600">Agents Group  (workspace)</text>

    <rect x="88" y="868" width="160" height="64" rx="9" fill="#312e81" stroke="#6366f1"/>
    <text x="104" y="892" fill="#e0e7ff" font-size="14" font-weight="600">Common pi agent</text>
    <text x="104" y="912" fill="#c7d2fe" font-size="12">flow-author (locked)</text>

    <rect x="260" y="868" width="160" height="64" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="276" y="892" fill="#f8fafc" font-size="14" font-weight="600">Agent A</text>
    <text x="276" y="912" fill="#94a3b8" font-size="12">.pi workspace</text>

    <rect x="436" y="868" width="160" height="64" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="452" y="892" fill="#f8fafc" font-size="14" font-weight="600">Agent B</text>
    <text x="452" y="912" fill="#94a3b8" font-size="12">.pi workspace</text>

    <rect x="88" y="948" width="508" height="56" rx="9" fill="#0f172a" stroke="#3b4d6b"/>
    <text x="108" y="972" fill="#f8fafc" font-size="14" font-weight="600">Resource bundles (zip): packages · extensions · prompts · skills</text>
    <text x="108" y="992" fill="#94a3b8" font-size="12">uploaded to group - associated to agents (pi install / extract + reload)</text>
  </g>

  <!-- Section D: audit -->
  <text x="660" y="760" fill="#e2e8f0" font-size="24" font-weight="600">Audit · replay · observability</text>
  <g filter="url(#shadow)">
    <rect x="660" y="784" width="556" height="240" rx="14" fill="#0b1220" stroke="#334155"/>

    <rect x="684" y="808" width="508" height="56" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="832" fill="#f8fafc" font-size="15" font-weight="600">Temporal event history</text>
    <text x="704" y="852" fill="#94a3b8" font-size="13">run-level durability + replay record</text>

    <rect x="684" y="876" width="508" height="56" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="900" fill="#f8fafc" font-size="15" font-weight="600">acpx trace.ndjson bundles</text>
    <text x="704" y="920" fill="#94a3b8" font-size="13">per-step trace + agent turns (prompts, tool calls, outputs)</text>

    <rect x="684" y="944" width="508" height="56" rx="9" fill="#1e293b" stroke="#3b4d6b"/>
    <text x="704" y="968" fill="#f8fafc" font-size="15" font-weight="600">Postgres audit_event</text>
    <text x="704" y="988" fill="#94a3b8" font-size="13">business events: create / edit / approve / upload / invoke</text>
  </g>

  <!-- Footer: principles -->
  <text x="64" y="1080" fill="#e2e8f0" font-size="24" font-weight="600">Guiding principles</text>
  <g font-size="14">
    <g filter="url(#shadow)"><rect x="64" y="1104" width="280" height="74" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="84" y="1132" fill="#f8fafc" font-size="15" font-weight="600">Minimalistic card UI</text>
      <text x="84" y="1156" fill="#94a3b8">low chrome, not verbose</text></g>
    <g filter="url(#shadow)"><rect x="360" y="1104" width="280" height="74" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="380" y="1132" fill="#f8fafc" font-size="15" font-weight="600">Isolated projects</text>
      <text x="380" y="1156" fill="#94a3b8">modular monorepo</text></g>
    <g filter="url(#shadow)"><rect x="656" y="1104" width="280" height="74" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="676" y="1132" fill="#f8fafc" font-size="15" font-weight="600">gRPC for remote access</text>
      <text x="676" y="1156" fill="#94a3b8">tonic services</text></g>
    <g filter="url(#shadow)"><rect x="952" y="1104" width="264" height="74" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="972" y="1132" fill="#f8fafc" font-size="15" font-weight="600">Audit + replay first</text>
      <text x="972" y="1156" fill="#94a3b8">esp. for agents</text></g>
  </g>

  <!-- roadmap strip -->
  <text x="64" y="1240" fill="#e2e8f0" font-size="24" font-weight="600">Roadmap</text>
  <g font-size="13">
    <g><rect x="64" y="1262" width="180" height="58" rx="9" fill="#064e3b" stroke="#10b981"/>
      <text x="80" y="1287" fill="#d1fae5" font-size="14" font-weight="600">0 · Docs</text>
      <text x="80" y="1307" fill="#a7f3d0">this north star</text></g>
    <g><rect x="260" y="1262" width="180" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <text x="276" y="1287" fill="#f8fafc" font-size="14" font-weight="600">1 · Skeleton</text>
      <text x="276" y="1307" fill="#94a3b8">monorepo + IR + DB</text></g>
    <g><rect x="456" y="1262" width="180" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <text x="472" y="1287" fill="#f8fafc" font-size="14" font-weight="600">2 · Groups</text>
      <text x="472" y="1307" fill="#94a3b8">agents + resources</text></g>
    <g><rect x="652" y="1262" width="180" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <text x="668" y="1287" fill="#f8fafc" font-size="14" font-weight="600">3 · Authoring</text>
      <text x="668" y="1307" fill="#94a3b8">IR + canvas</text></g>
    <g><rect x="848" y="1262" width="180" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <text x="864" y="1287" fill="#f8fafc" font-size="14" font-weight="600">4 · Execution</text>
      <text x="864" y="1307" fill="#94a3b8">Temporal + acpx</text></g>
    <g><rect x="1044" y="1262" width="172" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <text x="1060" y="1287" fill="#f8fafc" font-size="14" font-weight="600">5-6 · Audit + remote</text>
      <text x="1060" y="1307" fill="#94a3b8">replay · gRPC · polish</text></g>
  </g>

  <text x="64" y="1380" fill="#475569" font-size="13">North-star design — see design-document.md for full diagrams and the Flow IR spec.</text>
</svg>
