<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2a44" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#dfe3ec"/>
    </pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa3b2"/></marker>
  </defs>
  <rect width="1280" height="820" fill="#f5f6fa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="232" height="820" fill="#ffffff"/>
  <line x1="232" y1="0" x2="232" y2="820" stroke="#e9ebf1"/>
  <rect x="24" y="28" width="30" height="30" rx="9" fill="url(#logo)"/>
  <text x="64" y="49" fill="#111827" font-size="16" font-weight="700">Agentic Workflows</text>
  <circle cx="40" cy="117" r="4" fill="#9ca3af"/><text x="60" y="122" fill="#6b7280" font-size="14">Groups</text>
  <rect x="16" y="140" width="200" height="42" rx="10" fill="#eef2ff"/><rect x="16" y="140" width="3" height="42" rx="2" fill="#4f46e5"/>
  <circle cx="40" cy="161" r="4" fill="#4f46e5"/><text x="60" y="166" fill="#4f46e5" font-size="14" font-weight="600">Flows</text>
  <circle cx="40" cy="201" r="4" fill="#9ca3af"/><text x="60" y="206" fill="#6b7280" font-size="14">Runs</text>
  <circle cx="40" cy="241" r="4" fill="#9ca3af"/><text x="60" y="246" fill="#6b7280" font-size="14">Audit</text>
  <circle cx="40" cy="281" r="4" fill="#9ca3af"/><text x="60" y="286" fill="#6b7280" font-size="14">Settings</text>

  <!-- Topbar -->
  <rect x="232" y="0" width="1048" height="64" fill="#ffffff"/>
  <line x1="232" y1="64" x2="1280" y2="64" stroke="#e9ebf1"/>
  <text x="264" y="40" fill="#9ca3af" font-size="14">Groups / Support /</text>
  <text x="402" y="40" fill="#111827" font-size="14" font-weight="700">Bug triage and fix</text>
  <circle cx="1232" cy="32" r="14" fill="#e0e7ff"/><text x="1232" y="37" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle">CM</text>

  <!-- Flow toolbar -->
  <g filter="url(#card)"><rect x="264" y="84" width="984" height="56" rx="14" fill="#ffffff"/></g>
  <text x="288" y="118" fill="#111827" font-size="15" font-weight="700">Bug triage and fix</text>
  <rect x="466" y="104" width="58" height="20" rx="10" fill="#eef2ff"/><text x="495" y="118" fill="#4f46e5" font-size="11" font-weight="600" text-anchor="middle">v3</text>
  <!-- palette chips -->
  <text x="566" y="117" fill="#9ca3af" font-size="12">add:</text>
  <rect x="598" y="103" width="56" height="24" rx="12" fill="#f3e8ff"/><text x="626" y="119" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">acp</text>
  <rect x="660" y="103" width="64" height="24" rx="12" fill="#eff6ff"/><text x="692" y="119" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">action</text>
  <rect x="730" y="103" width="74" height="24" rx="12" fill="#eef2ff"/><text x="767" y="119" fill="#4f46e5" font-size="11" font-weight="600" text-anchor="middle">compute</text>
  <rect x="810" y="103" width="76" height="24" rx="12" fill="#fff7ed"/><text x="848" y="119" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle">decision</text>
  <rect x="892" y="103" width="86" height="24" rx="12" fill="#fffbeb"/><text x="935" y="119" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle">checkpoint</text>
  <!-- actions -->
  <rect x="1014" y="100" width="86" height="32" rx="9" fill="#ecfdf5"/><text x="1057" y="120" fill="#047857" font-size="12" font-weight="600" text-anchor="middle">✓ Validate</text>
  <rect x="1108" y="100" width="60" height="32" rx="9" fill="#ffffff" stroke="#d8dbe6"/><text x="1138" y="120" fill="#374151" font-size="12" font-weight="600" text-anchor="middle">Save</text>
  <rect x="1176" y="100" width="48" height="32" rx="9" fill="#4f46e5"/><text x="1200" y="120" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Run</text>

  <!-- Canvas -->
  <g filter="url(#card)"><rect x="264" y="152" width="716" height="548" rx="14" fill="#ffffff"/></g>
  <rect x="272" y="160" width="700" height="532" rx="10" fill="url(#dots)"/>

  <!-- edges -->
  <g fill="none" stroke="#9aa3b2" stroke-width="2">
    <path d="M358,162 L358,190" marker-end="url(#ar)"/>
    <path d="M436,218 L466,218" marker-end="url(#ar)"/>
    <path d="M626,218 L656,218" marker-end="url(#ar)"/>
    <path d="M816,218 L846,212" marker-end="url(#ar)"/>
    <path d="M738,246 L738,306" marker-end="url(#ar)"/>
    <path d="M738,366 L738,426" marker-end="url(#ar)"/>
    <path d="M660,458 L630,458" marker-end="url(#ar)"/>
    <path d="M470,458 L424,452" marker-end="url(#ar)"/>
  </g>
  <!-- edge labels -->
  <rect x="822" y="196" width="44" height="18" rx="9" fill="#ffffff" stroke="#eceef4"/><text x="844" y="209" fill="#6b7280" font-size="10" text-anchor="middle">close</text>
  <rect x="744" y="268" width="92" height="18" rx="9" fill="#ffffff" stroke="#eceef4"/><text x="790" y="281" fill="#6b7280" font-size="10" text-anchor="middle">bug / feature</text>

  <!-- start -->
  <circle cx="358" cy="150" r="12" fill="#111827"/><text x="358" y="154" fill="#ffffff" font-size="11" text-anchor="middle">▶</text>

  <!-- node: load_report (compute) -->
  <rect x="280" y="190" width="156" height="56" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="292" y="204" width="28" height="28" rx="8" fill="#eef2ff"/><text x="306" y="223" fill="#4f46e5" font-size="13" text-anchor="middle">ƒ</text>
  <text x="330" y="214" fill="#111827" font-size="13" font-weight="600">load_report</text>
  <rect x="330" y="222" width="62" height="16" rx="8" fill="#eef2ff"/><text x="361" y="234" fill="#4f46e5" font-size="9" font-weight="600" text-anchor="middle">compute</text>

  <!-- node: reproduce (acp) SELECTED -->
  <rect x="470" y="190" width="156" height="56" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="482" y="204" width="28" height="28" rx="8" fill="#f3e8ff"/><text x="496" y="223" fill="#7c3aed" font-size="13" text-anchor="middle">✷</text>
  <text x="520" y="214" fill="#111827" font-size="13" font-weight="600">reproduce</text>
  <rect x="520" y="222" width="40" height="16" rx="8" fill="#f3e8ff"/><text x="540" y="234" fill="#7c3aed" font-size="9" font-weight="600" text-anchor="middle">acp</text>
  <rect x="566" y="222" width="44" height="16" rx="8" fill="#fdf2f8"/><text x="588" y="234" fill="#9d174d" font-size="9" font-weight="600" text-anchor="middle">triage</text>

  <!-- node: classify (decision) -->
  <rect x="660" y="190" width="156" height="56" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="672" y="204" width="28" height="28" rx="8" fill="#fff7ed"/><text x="686" y="223" fill="#b45309" font-size="13" text-anchor="middle">◇</text>
  <text x="710" y="214" fill="#111827" font-size="13" font-weight="600">classify</text>
  <rect x="710" y="222" width="64" height="16" rx="8" fill="#fff7ed"/><text x="742" y="234" fill="#b45309" font-size="9" font-weight="600" text-anchor="middle">decision</text>

  <!-- node: closed (end) -->
  <rect x="846" y="190" width="120" height="44" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="858" y="200" width="24" height="24" rx="7" fill="#f3f4f6"/><text x="870" y="217" fill="#6b7280" font-size="12" text-anchor="middle">■</text>
  <text x="892" y="216" fill="#111827" font-size="13" font-weight="600">closed</text>

  <!-- node: draft_fix (acp dev) -->
  <rect x="660" y="306" width="156" height="56" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="672" y="320" width="28" height="28" rx="8" fill="#f3e8ff"/><text x="686" y="339" fill="#7c3aed" font-size="13" text-anchor="middle">✷</text>
  <text x="710" y="330" fill="#111827" font-size="13" font-weight="600">draft_fix</text>
  <rect x="710" y="338" width="40" height="16" rx="8" fill="#f3e8ff"/><text x="730" y="350" fill="#7c3aed" font-size="9" font-weight="600" text-anchor="middle">acp</text>
  <rect x="756" y="338" width="34" height="16" rx="8" fill="#f0fdf4"/><text x="773" y="350" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">dev</text>

  <!-- node: approve (checkpoint) -->
  <rect x="660" y="426" width="156" height="56" rx="12" fill="#fffdf6" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="672" y="440" width="28" height="28" rx="8" fill="#fffbeb"/><text x="686" y="459" fill="#b45309" font-size="13" text-anchor="middle">⏸</text>
  <text x="710" y="450" fill="#111827" font-size="13" font-weight="600">approve_pr</text>
  <rect x="710" y="458" width="86" height="16" rx="8" fill="#fffbeb"/><text x="753" y="470" fill="#b45309" font-size="9" font-weight="600" text-anchor="middle">checkpoint</text>

  <!-- node: open_pr (action) -->
  <rect x="470" y="426" width="156" height="56" rx="12" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="482" y="440" width="28" height="28" rx="8" fill="#eff6ff"/><text x="496" y="459" fill="#2563eb" font-size="13" text-anchor="middle">⚡</text>
  <text x="520" y="450" fill="#111827" font-size="13" font-weight="600">open_pr</text>
  <rect x="520" y="458" width="50" height="16" rx="8" fill="#eff6ff"/><text x="545" y="470" fill="#2563eb" font-size="9" font-weight="600" text-anchor="middle">action</text>

  <!-- node: landed (end) -->
  <rect x="300" y="426" width="124" height="52" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="312" y="438" width="26" height="26" rx="7" fill="#ecfdf5"/><text x="325" y="456" fill="#047857" font-size="12" text-anchor="middle">✓</text>
  <text x="348" y="456" fill="#111827" font-size="13" font-weight="600">landed</text>

  <!-- minimap -->
  <rect x="844" y="612" width="120" height="72" rx="8" fill="#ffffff" stroke="#e6e8ee"/>
  <rect x="856" y="624" width="14" height="8" rx="2" fill="#c7cdda"/>
  <rect x="884" y="624" width="14" height="8" rx="2" fill="#c7cdda"/>
  <rect x="912" y="624" width="14" height="8" rx="2" fill="#c7cdda"/>
  <rect x="884" y="644" width="14" height="8" rx="2" fill="#c7cdda"/>
  <rect x="884" y="662" width="14" height="8" rx="2" fill="#f0c36b"/>
  <rect x="856" y="662" width="14" height="8" rx="2" fill="#c7cdda"/>

  <!-- Inspector -->
  <g filter="url(#card)"><rect x="996" y="152" width="252" height="548" rx="14" fill="#ffffff"/></g>
  <text x="1018" y="184" fill="#111827" font-size="14" font-weight="700">Inspector</text>
  <rect x="1180" y="170" width="46" height="20" rx="10" fill="#f3e8ff"/><text x="1203" y="184" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">acp</text>
  <line x1="1018" y1="200" x2="1226" y2="200" stroke="#f0f1f5"/>

  <text x="1018" y="226" fill="#6b7280" font-size="11" font-weight="600">NAME</text>
  <rect x="1018" y="234" width="208" height="34" rx="9" fill="#fafbfe" stroke="#e6e8ee"/><text x="1032" y="256" fill="#111827" font-size="13">reproduce</text>

  <text x="1018" y="294" fill="#6b7280" font-size="11" font-weight="600">AGENT</text>
  <rect x="1018" y="302" width="208" height="34" rx="9" fill="#fafbfe" stroke="#e6e8ee"/>
  <circle cx="1036" cy="319" r="7" fill="#fbcfe8"/><text x="1036" y="323" font-size="9" fill="#9d174d" text-anchor="middle" font-weight="700">tr</text>
  <text x="1052" y="324" fill="#111827" font-size="13">triage</text><text x="1212" y="324" fill="#9ca3af" font-size="12">▾</text>

  <text x="1018" y="362" fill="#6b7280" font-size="11" font-weight="600">SYSTEM PROMPT</text>
  <rect x="1018" y="370" width="208" height="56" rx="9" fill="#fafbfe" stroke="#e6e8ee"/>
  <text x="1032" y="390" fill="#374151" font-size="11">You are a meticulous QA</text>
  <text x="1032" y="406" fill="#374151" font-size="11">engineer. Reproduce the bug</text>
  <text x="1032" y="420" fill="#9ca3af" font-size="11">and capture exact steps…</text>

  <text x="1018" y="452" fill="#6b7280" font-size="11" font-weight="600">PROMPT</text>
  <rect x="1018" y="460" width="208" height="48" rx="9" fill="#fafbfe" stroke="#e6e8ee"/>
  <text x="1032" y="480" fill="#374151" font-size="11">Reproduce {{report}} and</text>
  <text x="1032" y="496" fill="#374151" font-size="11">return a diagnosis object.</text>

  <text x="1018" y="534" fill="#6b7280" font-size="11" font-weight="600">INPUTS</text>
  <rect x="1018" y="542" width="64" height="22" rx="11" fill="#f1f2f7"/><text x="1050" y="557" fill="#6b7280" font-size="11" text-anchor="middle">report</text>
  <text x="1018" y="592" fill="#6b7280" font-size="11" font-weight="600">OUTPUTS</text>
  <rect x="1018" y="600" width="78" height="22" rx="11" fill="#eef2ff"/><text x="1057" y="615" fill="#4f46e5" font-size="11" text-anchor="middle">diagnosis</text>

  <line x1="1018" y1="644" x2="1226" y2="644" stroke="#f0f1f5"/>
  <rect x="1018" y="658" width="120" height="30" rx="9" fill="#ffffff" stroke="#d8dbe6"/><text x="1078" y="678" fill="#374151" font-size="12" font-weight="600" text-anchor="middle">Duplicate</text>
  <rect x="1146" y="658" width="80" height="30" rx="9" fill="#fef2f2"/><text x="1186" y="678" fill="#dc2626" font-size="12" font-weight="600" text-anchor="middle">Delete</text>
</svg>
