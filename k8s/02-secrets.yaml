---
# GitHub PAT Secret — Planner agent
# Replace the placeholder value with: echo -n '<your-github-pat>' | base64
# Rotate every 90 days as per annotation below.
apiVersion: v1
kind: Secret
metadata:
  name: github-pat-planner
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: credentials
    app: pi-planner
  annotations:
    # 90-day rotation policy — update this date and the token value together
    secret/rotation-schedule: "every 90 days"
    secret/last-rotated: "2026-06-19"
    secret/next-rotation: "2026-09-17"
    description: "GitHub PAT for planner agent — private repo read/write access required"
type: Opaque
data:
  # base64-encoded placeholder — replace before deploying
  # Generate: echo -n 'ghp_YOUR_ACTUAL_TOKEN' | base64
  GITHUB_PAT: cGxhY2Vob2xkZXItZ2l0aHViLXBhdC1wbGFubmVy
---
# GitHub PAT Secret — Reviewer agent
apiVersion: v1
kind: Secret
metadata:
  name: github-pat-reviewer
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: credentials
    app: pi-reviewer
  annotations:
    secret/rotation-schedule: "every 90 days"
    secret/last-rotated: "2026-06-19"
    secret/next-rotation: "2026-09-17"
    description: "GitHub PAT for reviewer agent — private repo read access required"
type: Opaque
data:
  GITHUB_PAT: cGxhY2Vob2xkZXItZ2l0aHViLXBhdC1yZXZpZXdlcg==
---
# GitHub PAT Secret — Security agent
apiVersion: v1
kind: Secret
metadata:
  name: github-pat-security
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: credentials
    app: pi-security
  annotations:
    secret/rotation-schedule: "every 90 days"
    secret/last-rotated: "2026-06-19"
    secret/next-rotation: "2026-09-17"
    description: "GitHub PAT for security agent — private repo read access required"
type: Opaque
data:
  GITHUB_PAT: cGxhY2Vob2xkZXItZ2l0aHViLXBhdC1zZWN1cml0eQ==
---
# Anthropic API Key — used by planner (claude-opus-4-7) and security (claude-sonnet-4-6) agents
# Replace with: echo -n 'sk-ant-YOUR_KEY' | base64
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: credentials
  annotations:
    secret/rotation-schedule: "every 90 days"
    secret/last-rotated: "2026-06-19"
    secret/next-rotation: "2026-09-17"
    description: "Anthropic API key for Claude-family agent models"
type: Opaque
data:
  # Generate: echo -n 'sk-ant-YOUR_ACTUAL_KEY' | base64
  ANTHROPIC_API_KEY: cGxhY2Vob2xkZXItYW50aHJvcGljLWFwaS1rZXk=
---
# OpenAI API Key — used by reviewer agent (gpt-5.5)
# Replace with: echo -n 'sk-YOUR_OPENAI_KEY' | base64
apiVersion: v1
kind: Secret
metadata:
  name: openai-api-key
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: credentials
    app: pi-reviewer
  annotations:
    secret/rotation-schedule: "every 90 days"
    secret/last-rotated: "2026-06-19"
    secret/next-rotation: "2026-09-17"
    description: "OpenAI API key for GPT-family reviewer agent model"
type: Opaque
data:
  # Generate: echo -n 'sk-YOUR_ACTUAL_OPENAI_KEY' | base64
  OPENAI_API_KEY: cGxhY2Vob2xkZXItb3BlbmFpLWFwaS1rZXk=
