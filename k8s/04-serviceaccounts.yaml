---
# ServiceAccount for all PiSpec Flow agent pods
# Annotated for IRSA (IAM Roles for Service Accounts) — EKS-native AWS credential injection
# Replace {{IRSA_ROLE_ARN}} with the ARN of an IAM role granting EFS and optional Secrets Manager access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pispec-sa
  namespace: pi-agents
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: rbac
  annotations:
    # IRSA: EKS injects AWS credentials for this role into pods using this ServiceAccount
    # Required IAM permissions: elasticfilesystem:*, secretsmanager:GetSecretValue (optional)
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{AWS_ACCOUNT_ID}}:role/{{IRSA_ROLE_NAME}}"
    description: "ServiceAccount for PiSpec Flow agent pods with IRSA for AWS access"
automountServiceAccountToken: true
---
# ClusterRole — grants read access to Secrets in pi-agents namespace
# Useful when an agent sidecar or init container needs to pull secrets via the Kubernetes API
# (alternative to AWS Secrets Manager integration)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pispec-secret-reader
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: rbac
  annotations:
    description: "Allows reading Secrets — for optional in-cluster secret injection"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
    # Restrict to specific secret names for least-privilege access
    resourceNames:
      - github-pat-planner
      - github-pat-reviewer
      - github-pat-security
      - anthropic-api-key
      - openai-api-key
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
    resourceNames:
      - pi-agent-config
      - acpx-config
---
# ClusterRoleBinding — binds the ClusterRole to the pispec-sa ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pispec-secret-reader-binding
  labels:
    app.kubernetes.io/part-of: pispec-flow
    app.kubernetes.io/component: rbac
  annotations:
    description: "Binds pispec-secret-reader ClusterRole to pispec-sa in pi-agents namespace"
subjects:
  - kind: ServiceAccount
    name: pispec-sa
    namespace: pi-agents
roleRef:
  kind: ClusterRole
  name: pispec-secret-reader
  apiGroup: rbac.authorization.k8s.io
