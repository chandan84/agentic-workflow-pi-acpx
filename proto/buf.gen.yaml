version: v2
plugins:
  - local: protoc-gen-go
    out: ../pkg/protogen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../pkg/protogen
    opt: paths=source_relative,require_unimplemented_servers=false
  # TypeScript generation (Connect-ES v2). Output lands in the web app's
  # src/gen/ directory so pages can import { AgentsService } from there
  # and construct Connect clients with createClient(svc, transport).
  - local: ["npx", "--prefix", "../apps/desktop/web", "protoc-gen-es"]
    out: ../apps/desktop/web/src/gen
    opt:
      - target=ts
      - import_extension=js
