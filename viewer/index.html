<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiSpec Flow — Spec Viewer</title>

  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <!-- highlight.js for syntax highlighting inside code blocks -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

  <!-- mermaid.js for diagram rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>

  <style>
    /* ─── Reset & Tokens ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #21262d;
      --surface3:    #30363d;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --accent:      #58a6ff;
      --accent-dim:  #1f3a5f;
      --green:       #3fb950;
      --green-dim:   #1a3a24;
      --red:         #f85149;
      --red-dim:     #3a1a1a;
      --yellow:      #d29922;
      --yellow-dim:  #3a2d10;
      --radius:      8px;
      --radius-lg:   12px;
      --shadow:      0 4px 24px rgba(0,0,0,.5);
      --font-mono:   'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      --font-sans:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition:  150ms ease;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ─── Layout ────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      text-decoration: none;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #a371f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .change-id-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      color: var(--text-muted);
    }

    #status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid transparent;
      transition: var(--transition);
    }

    #status-badge.pending  { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow); }
    #status-badge.approved { background: var(--green-dim);  color: var(--green);  border-color: var(--green);  }
    #status-badge.rejected { background: var(--red-dim);    color: var(--red);    border-color: var(--red);    }
    #status-badge::before  { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 80px;
    }

    /* ─── Error / loading states ─────────────────────────────────────── */
    #loading-state, #error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--surface3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-state .error-icon { font-size: 40px; }
    #error-state p { font-size: 15px; max-width: 420px; text-align: center; }

    /* ─── Tabs ───────────────────────────────────────────────────────── */
    .tabs-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 18px;
      margin-bottom: -1px;
      transition: color var(--transition), border-color var(--transition);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-icon { font-size: 15px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ─── Markdown content ───────────────────────────────────────────── */
    .md-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 40px;
      min-height: 300px;
    }

    .md-body h1, .md-body h2, .md-body h3,
    .md-body h4, .md-body h5, .md-body h6 {
      color: var(--text);
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .md-body h1 { font-size: 1.75em; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .md-body h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .md-body h3 { font-size: 1.15em; }

    .md-body p { margin-bottom: 14px; color: var(--text); }

    .md-body a { color: var(--accent); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }

    .md-body ul, .md-body ol {
      margin: 0 0 14px 22px;
    }

    .md-body li { margin-bottom: 4px; }

    .md-body blockquote {
      border-left: 3px solid var(--accent);
      background: var(--surface2);
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 16px 0;
      padding: 12px 16px;
      color: var(--text-muted);
    }

    .md-body table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .md-body th {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 8px 14px;
      text-align: left;
      font-weight: 600;
    }

    .md-body td {
      border: 1px solid var(--border);
      padding: 7px 14px;
    }

    .md-body tr:nth-child(even) td { background: var(--surface2); }

    .md-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* Inline code */
    .md-body :not(pre) > code {
      font-family: var(--font-mono);
      font-size: .85em;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      color: #79c0ff;
    }

    /* Fenced code blocks */
    .md-body pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      margin-bottom: 16px;
      position: relative;
    }

    .md-body pre code {
      display: block;
      padding: 16px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      background: none;
      border: none;
      color: var(--text);
    }

    /* Mermaid diagrams */
    .mermaid-wrapper {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      overflow-x: auto;
      text-align: center;
    }

    .mermaid-wrapper svg {
      max-width: 100%;
      height: auto;
    }

    /* ─── Approval panel ─────────────────────────────────────────────── */
    .approval-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .approval-panel h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .approval-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: filter var(--transition), opacity var(--transition);
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:not(:disabled):hover { filter: brightness(1.15); }

    .btn-approve {
      background: var(--green);
      color: #0d1117;
      border-color: var(--green);
    }

    .btn-reject {
      background: transparent;
      color: var(--red);
      border-color: var(--red);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
    }

    /* Feedback area */
    #feedback-area {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #feedback-area.open { display: flex; }

    #feedback-area label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    #feedback-text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      min-height: 100px;
      padding: 12px 14px;
      resize: vertical;
      transition: border-color var(--transition);
      width: 100%;
    }

    #feedback-text:focus {
      outline: none;
      border-color: var(--accent);
    }

    .feedback-submit-row {
      display: flex;
      gap: 10px;
    }

    /* Approval result card */
    #approval-result {
      display: none;
    }

    #approval-result.visible {
      display: block;
    }

    .approval-result-card {
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .approval-result-card.approved {
      background: var(--green-dim);
      border: 1px solid var(--green);
    }

    .approval-result-card.rejected {
      background: var(--red-dim);
      border: 1px solid var(--red);
    }

    .result-title {
      font-weight: 700;
      font-size: 15px;
    }

    .result-title.approved { color: var(--green); }
    .result-title.rejected { color: var(--red); }

    .result-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .result-meta span::before {
      content: attr(data-label) ': ';
      font-weight: 600;
    }

    .result-feedback {
      font-size: 13px;
      background: rgba(0,0,0,.2);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 4px;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* ─── Toast ──────────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 14px;
      max-width: 360px;
      padding: 12px 16px;
      pointer-events: auto;
      animation: slideIn .25s ease forwards;
    }

    .toast.success { border-left-color: var(--green); }
    .toast.error   { border-left-color: var(--red);   }
    .toast.info    { border-left-color: var(--accent); }
    .toast.fade-out { animation: fadeOut .3s ease forwards; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(30px); }
    }

    /* ─── Modal ──────────────────────────────────────────────────────── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }

    #modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal input[type="email"],
    .modal textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 12px;
      width: 100%;
      transition: border-color var(--transition);
    }

    .modal input[type="email"]:focus,
    .modal textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal textarea { min-height: 80px; resize: vertical; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    /* ─── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .md-body { padding: 20px 18px; }
      .approval-panel { padding: 20px 18px; }
      header { padding: 0 16px; }
      main { padding: 16px 16px 60px; }
    }
  </style>
</head>

<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header>
    <a class="logo" href="#">
      <div class="logo-icon">&#960;</div>
      PiSpec Flow
    </a>
    <div class="header-meta">
      <span class="change-id-badge" id="change-id-label">change_id: —</span>
      <span id="status-badge" class="pending">Pending</span>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────────── -->
  <main id="main-content">

    <!-- Loading -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Loading specification…</p>
    </div>

    <!-- Error -->
    <div id="error-state" style="display:none">
      <span class="error-icon">&#x26A0;&#xFE0F;</span>
      <p id="error-message">Something went wrong.</p>
    </div>

    <!-- Tabs + content (hidden until loaded) -->
    <div id="content-area" style="display:none">

      <div class="tabs-bar" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="proposal" aria-selected="true">
          <span class="tab-icon">&#128221;</span> Proposal
        </button>
        <button class="tab-btn" role="tab" data-tab="spec" aria-selected="false">
          <span class="tab-icon">&#128196;</span> Specification
        </button>
        <button class="tab-btn" role="tab" data-tab="grill" aria-selected="false">
          <span class="tab-icon">&#129300;</span> Grill Answers
        </button>
      </div>

      <div id="tab-proposal" class="tab-panel active">
        <div class="md-body" id="body-proposal"></div>
      </div>

      <div id="tab-spec" class="tab-panel">
        <div class="md-body" id="body-spec"></div>
      </div>

      <div id="tab-grill" class="tab-panel">
        <div class="md-body" id="body-grill"></div>
      </div>

      <!-- ── Approval panel ──────────────────────────────────────────── -->
      <div class="approval-panel" id="approval-panel">
        <h3>Review Decision</h3>

        <!-- Existing approval result (shown when already decided) -->
        <div id="approval-result">
          <div class="approval-result-card" id="result-card">
            <div class="result-title" id="result-title"></div>
            <div class="result-meta">
              <span data-label="Reviewer" id="result-reviewer"></span>
              <span data-label="Timestamp" id="result-timestamp"></span>
            </div>
            <div class="result-feedback" id="result-feedback" style="display:none"></div>
          </div>
        </div>

        <!-- Action buttons (hidden after decision) -->
        <div class="approval-actions" id="approval-actions">
          <button class="btn btn-approve" id="btn-approve">
            &#10003; Approve
          </button>
          <button class="btn btn-reject" id="btn-reject">
            &#10007; Request Changes
          </button>
        </div>

        <!-- Inline feedback for rejection -->
        <div id="feedback-area">
          <label for="feedback-text">Feedback / required changes</label>
          <textarea id="feedback-text" placeholder="Describe the changes you are requesting…"></textarea>
          <div class="feedback-submit-row">
            <button class="btn btn-secondary" id="btn-cancel-reject">Cancel</button>
            <button class="btn btn-primary" id="btn-submit-reject">Submit Request</button>
          </div>
        </div>
      </div>

    </div><!-- /content-area -->
  </main>

</div><!-- /app -->

<!-- ── Email Modal ──────────────────────────────────────────────────── -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Confirm Review</h2>
    <label>
      Your email address
      <input type="email" id="modal-email" placeholder="you@example.com" autocomplete="email" />
    </label>
    <div id="modal-extra"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary"   id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<!-- ── Toast container ──────────────────────────────────────────────── -->
<div id="toast-container" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PiSpec Flow — Spec Viewer
   ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  /* ── Config ─────────────────────────────────────────────────────────── */
  const POLL_INTERVAL_MS  = 30_000;
  const APPROVAL_API      = '/api/approval';

  /* ── State ──────────────────────────────────────────────────────────── */
  let changeId        = null;
  let pollTimer       = null;
  let pendingDecision = null; // { approved: bool }

  /* ── DOM refs ───────────────────────────────────────────────────────── */
  const $  = id => document.getElementById(id);
  const loadingState    = $('loading-state');
  const errorState      = $('error-state');
  const errorMessage    = $('error-message');
  const contentArea     = $('content-area');
  const changeIdLabel   = $('change-id-label');
  const statusBadge     = $('status-badge');
  const approvalResult  = $('approval-result');
  const approvalActions = $('approval-actions');
  const feedbackArea    = $('feedback-area');
  const resultCard      = $('result-card');
  const resultTitle     = $('result-title');
  const resultReviewer  = $('result-reviewer');
  const resultTimestamp = $('result-timestamp');
  const resultFeedback  = $('result-feedback');
  const modalOverlay    = $('modal-overlay');
  const modalEmail      = $('modal-email');
  const modalExtra      = $('modal-extra');
  const modalTitle      = $('modal-title');

  /* ──────────────────────────────────────────────────────────────────── */
  /* Utilities                                                            */
  /* ──────────────────────────────────────────────────────────────────── */

  function showToast (msg, type = 'info', duration = 4000) {
    const container = $('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('fade-out');
      el.addEventListener('animationend', () => el.remove());
    }, duration);
  }

  function setStatus (state /* 'pending' | 'approved' | 'rejected' */) {
    const labels = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
    statusBadge.className = state;
    statusBadge.textContent = labels[state] || state;
  }

  function formatDate (iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        dateStyle: 'medium', timeStyle: 'short'
      });
    } catch { return iso; }
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Markdown + Mermaid rendering                                         */
  /* ──────────────────────────────────────────────────────────────────── */

  // Configure marked to use highlight.js for code fences
  marked.setOptions({
    gfm: true,
    breaks: false,
    renderer: buildRenderer()
  });

  function buildRenderer () {
    const renderer = new marked.Renderer();
    let mermaidIndex = 0;

    // Code blocks — intercept mermaid, highlight the rest
    renderer.code = function (token) {
      // marked v12 passes a token object with .lang and .text
      const lang = (token.lang || '').trim().toLowerCase();
      const text = token.text || token;
      if (lang === 'mermaid') {
        const id = `mermaid-${++mermaidIndex}-${Date.now()}`;
        return `<div class="mermaid-wrapper"><div class="mermaid" id="${id}">${escapeHtml(text)}</div></div>`;
      }
      // Highlight.js
      let highlighted;
      try {
        highlighted = lang && hljs.getLanguage(lang)
          ? hljs.highlight(text, { language: lang }).value
          : hljs.highlightAuto(text).value;
      } catch {
        highlighted = escapeHtml(text);
      }
      return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
    };

    return renderer;
  }

  function escapeHtml (str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderMarkdown (mdText, containerId) {
    const el = $(containerId);
    el.innerHTML = marked.parse(mdText);
    // Re-run mermaid on the newly-inserted elements
    const diagrams = el.querySelectorAll('.mermaid');
    if (diagrams.length) {
      mermaid.init(undefined, diagrams);
    }
    // Re-run highlight on any code blocks that might have been missed
    el.querySelectorAll('pre code:not(.hljs)').forEach(block => {
      hljs.highlightElement(block);
    });
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Document fetching                                                    */
  /* ──────────────────────────────────────────────────────────────────── */

  async function fetchDoc (filename) {
    const url = `/specs/openspec/changes/${encodeURIComponent(changeId)}/${filename}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching ${filename}`);
    return resp.text();
  }

  async function loadDocuments () {
    loadingState.style.display = 'flex';
    errorState.style.display   = 'none';
    contentArea.style.display  = 'none';

    try {
      const [proposal, spec, grill] = await Promise.all([
        fetchDoc('proposal.md'),
        fetchDoc('spec.md'),
        fetchDoc('grill-answers.md')
      ]);

      renderMarkdown(proposal, 'body-proposal');
      renderMarkdown(spec,     'body-spec');
      renderMarkdown(grill,    'body-grill');

      loadingState.style.display = 'none';
      contentArea.style.display  = 'block';
    } catch (err) {
      loadingState.style.display  = 'none';
      errorState.style.display    = 'flex';
      errorMessage.textContent    = `Failed to load specification documents: ${err.message}`;
      showToast('Failed to load documents. Check the change_id.', 'error', 8000);
    }
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Approval status                                                      */
  /* ──────────────────────────────────────────────────────────────────── */

  async function fetchApprovalStatus (silent = false) {
    try {
      const resp = await fetch(
        `${APPROVAL_API}/${encodeURIComponent(changeId)}`,
        { headers: { 'Accept': 'application/json' } }
      );

      if (resp.status === 404) {
        // No decision yet
        setStatus('pending');
        approvalResult.classList.remove('visible');
        approvalActions.style.display = 'flex';
        return;
      }

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const data = await resp.json();
      renderApprovalResult(data);
    } catch (err) {
      if (!silent) {
        showToast('Could not fetch approval status.', 'error');
      }
      console.error('[approval] status fetch failed:', err);
    }
  }

  function renderApprovalResult (data) {
    const approved = data.approved === true;
    const state    = approved ? 'approved' : 'rejected';

    setStatus(state);

    resultCard.className   = `approval-result-card ${state}`;
    resultTitle.className  = `result-title ${state}`;
    resultTitle.textContent = approved ? '✓ Approved' : '✗ Changes Requested';

    resultReviewer.textContent  = data.reviewer_email || '—';
    resultTimestamp.textContent = data.timestamp ? formatDate(data.timestamp) : '—';

    if (data.feedback) {
      resultFeedback.textContent    = data.feedback;
      resultFeedback.style.display  = 'block';
    } else {
      resultFeedback.style.display  = 'none';
    }

    approvalResult.classList.add('visible');
    approvalActions.style.display = 'none';
    feedbackArea.classList.remove('open');
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Polling                                                              */
  /* ──────────────────────────────────────────────────────────────────── */

  function startPolling () {
    stopPolling();
    pollTimer = setInterval(() => fetchApprovalStatus(true), POLL_INTERVAL_MS);
  }

  function stopPolling () {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Tabs                                                                 */
  /* ──────────────────────────────────────────────────────────────────── */

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(p => {
        p.classList.toggle('active', p.id === `tab-${tab}`);
      });
      // Trigger mermaid re-render for the newly visible tab
      const panel = document.getElementById(`tab-${tab}`);
      if (panel) {
        const diagrams = panel.querySelectorAll('.mermaid:not([data-processed])');
        if (diagrams.length) mermaid.init(undefined, diagrams);
      }
    });
  });

  /* ──────────────────────────────────────────────────────────────────── */
  /* Modal helpers                                                        */
  /* ──────────────────────────────────────────────────────────────────── */

  let modalResolve = null;

  function openModal (title, extraHtml = '') {
    return new Promise(resolve => {
      modalResolve = resolve;
      modalTitle.textContent = title;
      modalExtra.innerHTML   = extraHtml;
      modalEmail.value       = '';
      modalOverlay.classList.add('open');
      setTimeout(() => modalEmail.focus(), 50);
    });
  }

  function closeModal (result) {
    modalOverlay.classList.remove('open');
    if (modalResolve) { modalResolve(result); modalResolve = null; }
  }

  $('modal-cancel').addEventListener('click',  () => closeModal(null));
  $('modal-confirm').addEventListener('click', () => {
    const email = modalEmail.value.trim();
    if (!email || !email.includes('@')) {
      showToast('Please enter a valid email address.', 'error');
      return;
    }
    closeModal(email);
  });

  modalEmail.addEventListener('keydown', e => {
    if (e.key === 'Enter') $('modal-confirm').click();
    if (e.key === 'Escape') closeModal(null);
  });

  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal(null);
  });

  /* ──────────────────────────────────────────────────────────────────── */
  /* Approval actions                                                     */
  /* ──────────────────────────────────────────────────────────────────── */

  $('btn-approve').addEventListener('click', async () => {
    const email = await openModal('Confirm Approval');
    if (!email) return;

    await submitApproval({ approved: true, reviewer_email: email });
  });

  $('btn-reject').addEventListener('click', () => {
    pendingDecision = { approved: false };
    feedbackArea.classList.add('open');
    $('feedback-text').focus();
  });

  $('btn-cancel-reject').addEventListener('click', () => {
    feedbackArea.classList.remove('open');
    pendingDecision = null;
    $('feedback-text').value = '';
  });

  $('btn-submit-reject').addEventListener('click', async () => {
    const feedback = $('feedback-text').value.trim();
    if (!feedback) {
      showToast('Please provide feedback describing the required changes.', 'error');
      return;
    }

    const email = await openModal('Confirm Request for Changes');
    if (!email) return;

    await submitApproval({ approved: false, reviewer_email: email, feedback });
  });

  async function submitApproval (payload) {
    const body = {
      ...payload,
      change_id: changeId,
      timestamp: new Date().toISOString()
    };

    // Disable buttons during submission
    $('btn-approve').disabled = true;
    $('btn-reject').disabled  = true;
    $('btn-submit-reject').disabled = true;

    try {
      const resp = await fetch(APPROVAL_API, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body)
      });

      if (!resp.ok) {
        const errText = await resp.text().catch(() => '');
        throw new Error(`HTTP ${resp.status}${errText ? ': ' + errText : ''}`);
      }

      const data = await resp.json();
      renderApprovalResult(data);

      const verb = payload.approved ? 'approved' : 'requested changes on';
      showToast(`Successfully ${verb} this specification.`, 'success');
      stopPolling(); // No need to keep polling after a decision
    } catch (err) {
      console.error('[approval] submit failed:', err);
      showToast(`Submission failed: ${err.message}`, 'error', 8000);
    } finally {
      $('btn-approve').disabled = false;
      $('btn-reject').disabled  = false;
      $('btn-submit-reject').disabled = false;
      feedbackArea.classList.remove('open');
      pendingDecision = null;
    }
  }

  /* ──────────────────────────────────────────────────────────────────── */
  /* Boot                                                                 */
  /* ──────────────────────────────────────────────────────────────────── */

  async function init () {
    // Parse change_id from URL
    const params = new URLSearchParams(window.location.search);
    changeId = params.get('change_id');

    if (!changeId) {
      loadingState.style.display = 'none';
      errorState.style.display   = 'flex';
      errorMessage.textContent   =
        'No change_id provided. Use ?change_id=<your-change-id> in the URL.';
      return;
    }

    changeIdLabel.textContent = `change_id: ${changeId}`;
    document.title = `PiSpec Flow — ${changeId}`;

    // Initialise mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      darkMode: true,
      securityLevel: 'loose',
      fontFamily: 'inherit'
    });

    // Load documents and approval status in parallel
    await Promise.all([
      loadDocuments(),
      fetchApprovalStatus(false)
    ]);

    startPolling();
  }

  init();

})();
</script>
</body>
</html>
