# ─────────────────────────────────────────────────────────────────────────────
# PiSpec Flow — Spec Viewer nginx configuration
# Designed for Kubernetes sidecar pattern:
#   - /specs  → read-only EFS mount (markdown source files)
#   - /api/*  → Node.js approval sidecar on port 3001
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /tmp/nginx.pid;

events {
    worker_connections 1024;
    use                epoll;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml;

    # ── Upstream: Node.js approval sidecar ───────────────────────────────────
    upstream approval_api {
        server 127.0.0.1:3001;
        keepalive 8;
    }

    # ── CORS helper map ──────────────────────────────────────────────────────
    # Allow requests from the same origin (and optionally additional allowed
    # origins). Extend this map for multi-origin deployments.
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:\d+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:\d+)?$" "$http_origin";
        # Add your production domain here, e.g.:
        # "https://pispec.internal" "$http_origin";
    }

    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"   always;
        add_header X-Content-Type-Options   "nosniff"      always;
        add_header Referrer-Policy          "no-referrer"  always;
        add_header X-XSS-Protection         "1; mode=block" always;

        # ── CORS preflight helper ─────────────────────────────────────────────
        # Applied on all locations that need it via the map above.

        # ── Health check (Kubernetes liveness / readiness probe) ─────────────
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Readiness probe (alias) ───────────────────────────────────────────
        location = /ready {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── Static SPA (index.html) ───────────────────────────────────────────
        location = / {
            try_files /index.html =404;
        }

        location = /index.html {
            # Do not cache the HTML shell — it boots the SPA
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # ── Specs: read-only EFS mount at /specs ──────────────────────────────
        # Files are served directly from the EFS volume mounted at /specs.
        # Path structure: /specs/openspec/changes/{change_id}/proposal.md etc.
        location /specs/ {
            alias /specs/;
            autoindex off;

            # Markdown files are served as plain text so the browser JS can
            # fetch and parse them client-side with marked.js.
            location ~* \.md$ {
                default_type text/plain;
                charset      utf-8;
                add_header   Cache-Control "no-cache";
            }

            # All other files under /specs get a short cache window
            add_header Cache-Control "public, max-age=60";
        }

        # ── API: proxy to approval sidecar ────────────────────────────────────
        location /api/ {
            # CORS headers
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      "$cors_origin" always;
                add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Content-Type, Accept" always;
                add_header Access-Control-Max-Age           "3600" always;
                add_header Content-Length                   "0";
                add_header Content-Type                     "text/plain";
                return 204;
            }

            add_header Access-Control-Allow-Origin      "$cors_origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Accept" always;

            proxy_pass         http://approval_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            # Disable buffering for JSON responses
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── Deny hidden files ─────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Error pages ───────────────────────────────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root   /usr/share/nginx/html;
            internal;
        }
    }
}
